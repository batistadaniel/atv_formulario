<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculo da media do aluno</title>
</head>
<body>
  <form id="form">

    <!-- for e para o id -->
    <!-- name e o que sera usado no servidor -->
    <label for="nome">Nome:</label>
    <input type="text" id="nome" name="nome" required>
    <br>

    <label for="nota1">Nota 1:</label>
    <input type="number" id="nota1" name="nota1" min="1" max="10"  required>
    <br>

    <label for="nota2">Nota 2:</label>
    <input type="number" id="nota2" name="nota2" min="1" max="10" required>
    <br>

    <!-- tipo submit para quando o form form enviado -->
    <button type="submit" id="btn-calculo">Calcular Média</button>
  </form>

    
  <!-- mostar a situacao do aluno -->
  <div id="situacao" style="margin-top: 20px;"></div>

  <!-- tabela com os dados em localstorage -->
  <table id="cabecalho-tabela" border="2" cellspacing="0" cellpadding="6" width="50%" style="display: none; padding:10px; margin-top: 50px;">
    
    <thead>
      <tr>
        <th></th>
        <th>Nome</th>
        <th>Nota 1</th>
        <th>Nota 2</th>
      </tr>
    </thead>
    
    <tbody id="tabela">
    </tbody>
    
  </table>

  <script>
    // pega o form e o campo onde sera exibido
    const form = document.getElementById("form");
    const situacao = document.getElementById("situacao");
    // pega o tbody da tabela
    const tabela = document.getElementById('tabela')

    // vetor para adicionar os alunos
    let alunos = [];

    // tenta pegar do localStorage
    const dadosStorage = localStorage.getItem('alunos');

    // se existir algo salvo
    if(dadosStorage){

      // converte string JSON para vetor
      alunos = JSON.parse(dadosStorage)

      // mostra na tabela
      mostrarTabela()
    }

    // quando o formulario for enviado
    form.addEventListener("submit", async (e) => {
      // evita recarregar a pagina
      e.preventDefault();

      // pega os dados do formulario de forma simples e cria um objeto
      const dadosAluno = {
        nome: form.nome.value,
        nota1: form.nota1.value,
        nota2: form.nota2.value
      };

      alunos.push(dadosAluno);

       // salva no localStorage
      localStorage.setItem(
        'alunos',
        JSON.stringify(alunos)
      );

      // atualiza tabela
      mostrarTabela();

      // isso aqui deu trabalho pra porra, fui me guiando por um tutorial que nao dava para fazer igual, tive que pesquisar muito para entender como enviar os dados do formulario usando fetch, mas consegui kkkkk
      // isto abaixo envia o form para o backend
      const response = await fetch("http://localhost:3000/calculo", {
        method: "POST",
        headers: {
          "Content-Type": "application/json" // avisa o servidor que e json
        },
        body: JSON.stringify(dadosAluno) // transforma o objeto em texto
      });

      // pega a resposta e transforma em texto
      const conteudo = await response.text();

      // insere na div de situacao
      situacao.innerHTML = conteudo;

      // mais uma frescuragem para limpar o formulario depois de enviar kkkkk
      form.reset();
    });

    // funcao para mostrar a tabela
    function mostrarTabela() {

      // ativa o cabecalho-tabela
      // document.getElementById('cabecalho-tabela').style.width = '100%'
      document.getElementById('cabecalho-tabela').style.display = ''
      
      // limpa tabela antes
      tabela.innerHTML = '';

      // percorre vetor
      alunos.forEach(function(aluno, index){

        // adiciona linha
        tabela.innerHTML += `
          <tr>
            <td>${index + 1}</td>
            <td>${aluno.nome}</td>
            <td>${aluno.nota1}</td>
            <td>${aluno.nota2}</td>
          </tr>
        `

      });
    }

  </script>
</body>
</html>
